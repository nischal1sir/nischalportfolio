# Render Blueprint — deploys the backend as a Web Service.
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. In Render, choose "New" -> "Blueprint" and select this repo.
#   3. Set the environment variables below in the Render dashboard
#      (or via a Env Group). Do NOT commit real keys.
#
# After your first deploy, set the public URL Render gives you
# (e.g. https://portfolio-backend-xxxx.onrender.com) as VITE_API_URL
# in your Vercel project, and add your Vercel frontend URL to CORS_ALLOWED
# below (or update ALLOWED_ORIGINS in backend/server.ts).

services:
  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PORT
        value: "5000"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false

  - type: static
    name: portfolio-frontend
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
